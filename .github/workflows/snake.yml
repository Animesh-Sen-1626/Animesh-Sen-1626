{"name": "Generate snake", "on": {"schedule": [{"cron": "0 */12 * * *"}], "workflow_dispatch": null, "push": {"branches": ["main"]}}, "permissions": {"contents": "write"}, "jobs": {"generate": {"runs-on": "ubuntu-latest", "timeout-minutes": 5, "steps": [{"uses": "Platane/snk@v3", "with": {"github_user_name": "${{ github.repository_owner }}", "outputs": "dist/snake.svg\ndist/snake-dark.svg?palette=github-dark&color_snake=#f7c56b&color_dots=#161b22,#0e4a4a,#137a75,#2bb5aa,#5ef2e6"}}, {"uses": "crazy-max/ghaction-github-pages@v4", "with": {"target_branch": "output", "build_dir": "dist"}, "env": {"GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}}]}}}
