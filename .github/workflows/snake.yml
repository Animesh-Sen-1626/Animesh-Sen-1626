{"name": "Generate snake", "on": {"schedule": [{"cron": "0 */12 * * *"}], "workflow_dispatch": null, "push": {"branches": ["main"]}}, "permissions": {"contents": "write"}, "jobs": {"generate": {"runs-on": "ubuntu-latest", "timeout-minutes": 5, "steps": [{"uses": "Platane/snk@v3", "with": {"github_user_name": "${{ github.repository_owner }}", "outputs": "dist/snake.svg\ndist/snake-dark.svg?palette=github-dark&color_snake=#f7c56b&color_dots=#161b22,#2ea043,#39d353,#56d364,#7ee787"}}, {"name": "Leave a red trail behind the snake", "run": "python3 - dist/snake.svg dist/snake-dark.svg <<'PY'\n\"\"\"Post-process a Platane/snk SVG so eaten cells turn red once the snake's tail passes.\"\"\"\nimport re\nimport sys\n\nRED = {\"1\": \"#da3633\", \"2\": \"#f85149\", \"3\": \"#ff6a69\", \"4\": \"#ff9492\"}\n\ndef process(path):\n    s = open(path, encoding=\"utf-8\").read()\n    m = re.search(r\"animation:none (?:linear )?(\\d+)ms\", s)\n    total_ms = int(m.group(1))\n    step = 100 / (total_ms / 100)            # snk moves one cell every 100ms\n    length = len(set(re.findall(r\"\\.s\\.(s\\d+)\\{\", s))) or 4\n    tail = step * length\n\n    reds = \"\".join(f\"--r{k}:{v};\" for k, v in RED.items())\n    s = re.sub(r\":root\\{\", \":root{\" + reds, s, count=1)\n\n    pat = re.compile(\n        r\"@keyframes (c\\w+)\\{([\\d.]+)%\\{fill:var\\(--c(\\d)\\)\\}([\\d.]+)%,100%\\{fill:var\\(--ce\\)\\}\\}\"\n    )\n\n    def repl(m):\n        name, t_full, lvl, t_eaten = m.group(1), float(m.group(2)), m.group(3), float(m.group(4))\n        t_red = min(t_eaten + tail, 99.99)\n        return (\n            f\"@keyframes {name}{{{t_full}%{{fill:var(--c{lvl})}}\"\n            f\"{t_eaten}%{{fill:var(--ce)}}\"\n            f\"{t_red - 0.02:.2f}%{{fill:var(--ce)}}\"\n            f\"{t_red:.2f}%,100%{{fill:var(--r{lvl})}}}}\"\n        )\n\n    s, n = pat.subn(repl, s)\n    open(path, \"w\", encoding=\"utf-8\").write(s)\n    print(f\"{path}: {n} cells now leave a red trail\")\n\nfor p in sys.argv[1:]:\n    process(p)\nPY\n"}, {"uses": "crazy-max/ghaction-github-pages@v4", "with": {"target_branch": "output", "build_dir": "dist"}, "env": {"GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}}]}}}
